name: Publish
on:
  push: {}
  pull_request: {}
  release:
    types: [published]

env:
  Configuration: Release
  SolutionPath: src\Dotnet.Link.sln
  ProjectPath: src\Dotnet.Link\Dotnet.Link.csproj
  TestProjectPath: src\Dotnet.Link.Tests\Dotnet.Link.Tests.csproj

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ${{ env.SolutionPath }}
      - name: Run Unit Tests
        run: dotnet test ${{ env.TestProjectPath }} --configuration ${{ env.Configuration }} --no-restore

  publish:
    name: Publish
    runs-on: windows-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet tool restore
      - name: GitVersion
        run: dotnet gitversion /output buildserver
      - name: Build
        run: dotnet build ${{ env.ProjectPath }} --configuration ${{ env.Configuration }} -p:Version=${{ env.GitVersion_AssemblySemVer }} -p:PackageVersion=${{ env.GitVersion_SemVer }}
      - name: Pack
        run: dotnet pack ${{ env.ProjectPath }} --configuration ${{ env.Configuration }} -p:Version=${{ env.GitVersion_AssemblySemVer }} -p:PackageVersion=${{ env.GitVersion_FullSemVer }}
      - name: Push
        if: github.event_name == 'release'
        run: dotnet nuget push src\Dotnet.Link\bin\${{ env.Configuration }}\*.nupkg --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json